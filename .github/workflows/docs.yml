name: Docs

# Builds the documentation: the API reference with TypeDoc, then the Sphinx site in Docker.
# Called by Dev CI and by the release workflow (which publishes the result).
on:
  workflow_call:
    inputs:
      ref:
        description: The commit, branch or tag to build.
        type: string
        required: false
        default: ''
  workflow_dispatch:

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  build:
    name: Build documentation
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ inputs.ref }}

      - uses: ./.github/actions/setup

      - name: Generate the API reference (TypeDoc)
        run: pnpm docs:api

      - uses: docker/setup-buildx-action@v4

      # All Python tooling lives in the image built from docs/Dockerfile; nothing is
      # installed on the runner.
      - name: Build the Sphinx image
        uses: docker/build-push-action@v7
        with:
          context: docs
          tags: aide-docs
          load: true
          cache-from: type=gha,scope=docs
          cache-to: type=gha,scope=docs,mode=max

      # Warnings fail the build (see docs/Makefile).
      - name: Build the documentation
        run: |
          DOCS_UID=$(id -u) DOCS_GID=$(id -g) \
            docker compose -f docs/compose.yaml run --rm --no-deps -T docs make html

      - name: Keep the documentation
        uses: actions/upload-artifact@v7
        with:
          name: documentation
          path: docs/_build/html
          retention-days: 7
