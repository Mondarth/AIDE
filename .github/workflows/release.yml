name: Release

# Pushes to `main` (normally a merge from `dev`) are released:
#
#   1. Dev CI runs in full. Nothing is released unless it passes.
#   2. semantic-release works out the version from the commits, tags it, writes the changelog
#      and creates the GitHub release with the npm package (.tgz) attached.
#   3. If a release was cut: the Docker image is pushed to GHCR, the desktop installers are
#      built on Linux, Windows and macOS and attached to the release, and `dev` is brought
#      up to date with the release commit.
#   4. The documentation, with the Storybook, is published to GitHub Pages.
#
# It can also be started by hand on `main` (Actions > Release > Run workflow), for example to
# publish Pages again after a stalled deployment: Pages names deployments after the commit, so a
# re-run cannot replace a cancelled one, but a manual run releases only if there is something to
# release and otherwise just republishes the documentation.
on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: release
  cancel-in-progress: false

permissions:
  contents: read

env:
  HUSKY: '0'

jobs:
  ci:
    name: CI
    # A manual run can be started on any branch; only main is released and published.
    if: github.ref == 'refs/heads/main'
    uses: ./.github/workflows/dev.yml
    secrets: inherit

  release:
    name: Semantic release
    needs: ci
    runs-on: ubuntu-latest
    permissions:
      contents: write
      issues: write
      pull-requests: write
    outputs:
      version: ${{ steps.release.outputs.version }}
    steps:
      # The release App is on the rulesets' bypass list, so its token may push to the
      # protected branches. Each token expires within an hour.
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - name: Commit as the release App
        id: identity
        run: |
          name='${{ steps.app-token.outputs.app-slug }}[bot]'
          id=$(gh api "/users/${name}" --jq .id)
          echo "name=${name}" >> "$GITHUB_OUTPUT"
          echo "email=${id}+${name}@users.noreply.github.com" >> "$GITHUB_OUTPUT"
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
      - uses: actions/checkout@v7
        with:
          fetch-depth: 0
          # semantic-release pushes with the App token (below).
          persist-credentials: false
      - uses: ./.github/actions/setup
      - name: Release
        id: release
        run: pnpm exec semantic-release
        env:
          GITHUB_TOKEN: ${{ steps.app-token.outputs.token }}
          GIT_AUTHOR_NAME: ${{ steps.identity.outputs.name }}
          GIT_AUTHOR_EMAIL: ${{ steps.identity.outputs.email }}
          GIT_COMMITTER_NAME: ${{ steps.identity.outputs.name }}
          GIT_COMMITTER_EMAIL: ${{ steps.identity.outputs.email }}

  docker:
    name: Publish the Docker image
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      attestations: write
      id-token: write
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: docker/setup-qemu-action@v4
      - uses: docker/setup-buildx-action@v4
      - uses: docker/login-action@v4
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - id: meta
        uses: docker/metadata-action@v6
        with:
          # Container image names must be lower case.
          images: ghcr.io/mondarth/aide
          tags: |
            type=semver,pattern={{version}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}}.{{minor}},value=v${{ needs.release.outputs.version }}
            type=semver,pattern={{major}},value=v${{ needs.release.outputs.version }}
            type=raw,value=latest
      - name: Build and push
        id: push
        uses: docker/build-push-action@v7
        with:
          context: .
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          annotations: ${{ steps.meta.outputs.annotations }}
          provenance: mode=max
          sbom: true
          cache-from: type=gha,scope=app
          cache-to: type=gha,scope=app,mode=max

  desktop:
    name: Desktop installers (${{ matrix.os }})
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ${{ matrix.os }}
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest, macos-latest]
    steps:
      - uses: actions/checkout@v7
        with:
          ref: v${{ needs.release.outputs.version }}
      - uses: ./.github/actions/setup
      - run: pnpm build
      - name: Build the installers
        run: pnpm electron:dist
        env:
          # The installers are unsigned until signing certificates are configured.
          CSC_IDENTITY_AUTO_DISCOVERY: 'false'
      - name: Attach the installers to the release
        shell: bash
        run: |
          shopt -s nullglob
          files=(dist/electron/*.{AppImage,deb,exe,dmg,zip})
          gh release upload "v${{ needs.release.outputs.version }}" "${files[@]}" --clobber
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}

  sync-dev:
    name: Bring dev up to date
    needs: release
    if: needs.release.outputs.version != ''
    runs-on: ubuntu-latest
    steps:
      # The release App is on the rulesets' bypass list, so its token may push to the
      # protected branches. Each token expires within an hour.
      - name: Get a release token
        id: app-token
        uses: actions/create-github-app-token@v3
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
      - uses: actions/checkout@v7
        with:
          ref: main
          fetch-depth: 0
          token: ${{ steps.app-token.outputs.token }}
      # Fast-forwards dev onto the release commit. If dev has moved on, or the push is refused,
      # opens a pull request from main to dev instead (unless one is already open).
      - name: Merge main into dev
        run: |
          git fetch origin dev
          if git merge-base --is-ancestor origin/dev HEAD && git push origin HEAD:dev; then
            exit 0
          fi
          if gh pr list --base dev --head main --state open --json number --jq '.[0]' | grep -q .; then
            echo "A pull request from main to dev is already open."
            exit 0
          fi
          gh pr create --base dev --head main \
            --title "chore(release): merge v${VERSION} back into dev" \
            --body "Brings the release commit (version, changelog) from main back into dev."
        env:
          GH_TOKEN: ${{ steps.app-token.outputs.token }}
          VERSION: ${{ needs.release.outputs.version }}

  docs:
    name: Docs
    needs: release
    uses: ./.github/workflows/docs.yml
    with:
      ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}

  pages:
    name: Publish to GitHub Pages
    needs: [release, docs]
    runs-on: ubuntu-latest
    permissions:
      contents: read
      pages: write
      id-token: write
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v7
        with:
          ref: ${{ needs.release.outputs.version != '' && format('v{0}', needs.release.outputs.version) || github.sha }}
      - uses: ./.github/actions/setup
      - name: Build the Storybook
        run: pnpm build:storybook
      - uses: actions/download-artifact@v8
        with:
          name: documentation
          path: site
      - name: Add the Storybook to the site
        run: cp -r storybook-static site/storybook
      - uses: actions/configure-pages@v6
      # One artifact per attempt: a re-run of this job otherwise finds two named github-pages.
      - uses: actions/upload-pages-artifact@v5
        with:
          name: github-pages-${{ github.run_attempt }}
          path: site
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v5
        with:
          artifact_name: github-pages-${{ github.run_attempt }}
