name: Bug report
description: Something does not work as it should.
labels: [bug]
body:
  - type: textarea
    id: what
    attributes:
      label: What happened?
      description: What did you do, what did you expect, and what happened instead?
    validations:
      required: true
  - type: textarea
    id: reproduce
    attributes:
      label: Steps to reproduce
      placeholder: |
        1. …
        2. …
    validations:
      required: true
  - type: dropdown
    id: delivery
    attributes:
      label: How do you run AIDE?
      options: [Desktop app, Node.js (aide command), Docker, From source]
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Output of `aide --version`, or the release you installed.
    validations:
      required: true
  - type: input
    id: system
    attributes:
      label: Operating system and browser
  - type: textarea
    id: logs
    attributes:
      label: Logs or screenshots
      render: text
