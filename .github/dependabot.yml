version: 2
updates:
  - package-ecosystem: npm
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build(deps)
      prefix-development: build(deps-dev)
    ignore:
      # Version 10 needs conventional-changelog-writer 9, but semantic-release's notes generator
      # still uses writer 8 (tests/unit/config/release-notes.test.ts). Lift this once it upgrades.
      - dependency-name: conventional-changelog-conventionalcommits
        update-types: ['version-update:semver-major']
      # The types must match the oldest Node.js we support (engines, .nvmrc, Electron's Node), or
      # newer APIs type-check and then fail at run time. Moved with the baseline; see
      # .github/workflows/node-baseline.yml.
      - dependency-name: '@types/node'
        update-types: ['version-update:semver-major']
    groups:
      svelte:
        patterns: ['svelte', 'svelte-check', '@sveltejs/*', 'prettier-plugin-svelte', 'eslint-plugin-svelte']
      storybook:
        patterns: ['storybook', '@storybook/*']
      vitest:
        patterns: ['vitest', '@vitest/*', 'vitest-browser-svelte']
      playwright:
        patterns: ['playwright', '@playwright/*', '@axe-core/playwright']
      lint:
        patterns: ['eslint', '@eslint/*', 'eslint-*', 'typescript-eslint', 'globals', 'prettier']
      commit-tooling:
        patterns: ['@commitlint/*', 'commitizen', 'cz-*', 'husky', 'lint-staged']
      release:
        patterns: ['semantic-release', '@semantic-release/*', 'conventional-changelog-*']
      electron:
        patterns: ['electron', 'electron-builder']

  - package-ecosystem: docker
    directory: /
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docker)
    ignore:
      # The Node.js major is the project baseline, shared with Electron; moved by hand with it.
      - dependency-name: node
        update-types: ['version-update:semver-major']

  # Python requirements and base image of the documentation build.
  - package-ecosystem: pip
    directory: /docs
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docs)

  - package-ecosystem: docker
    directory: /docs
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: build(docs)

  - package-ecosystem: github-actions
    directories: ['/', '/.github/actions/*']
    target-branch: dev
    schedule:
      interval: weekly
    commit-message:
      prefix: ci(workflows)
